name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # `rake release` wants to push the tag; it already exists when this
      # runs, so bundler skips that step. id-token is the actual credential:
      # RubyGems trusts this repository and this workflow file.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Test
        run: bundle exec rspec && bundle exec rubocop
      - name: Refuse a tag that disagrees with the gem version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(ruby -r./lib/camelmailer/version -e 'print CamelMailer::VERSION')"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match CamelMailer::VERSION $version" >&2
            exit 1
          fi
      # Builds and pushes through the run's OIDC identity. No API key, and
      # so no OTP prompt that CI could never answer.
      - uses: rubygems/release-gem@v1
